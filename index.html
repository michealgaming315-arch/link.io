<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14">
<title>Link.io — Share More. Reach Further.</title>
<style>
:root{--bg:#080b14;--panel:#101625;--panel2:#151d30;--line:#263149;--text:#f5f7ff;--muted:#9ca9c3;--purple:#8b5cf6;--cyan:#22d3ee;--green:#4ade80}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#25205a 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;gap:15px;align-items:center;padding:13px 20px;background:#080b14ee;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.logo{font-size:25px;font-weight:950;letter-spacing:-1px;color:white;text-decoration:none;white-space:nowrap}.logo span{color:var(--cyan)}.search{flex:1;max-width:550px;margin:auto}.search input,.field input,.field textarea,.field select,.composer textarea{width:100%;background:#090f1b;border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--text);outline:none}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:9px 13px;font-weight:750}.btn.primary{background:linear-gradient(110deg,var(--purple),#5b7cfa,var(--cyan));border:0;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.layout{display:grid;grid-template-columns:205px minmax(0,660px) 260px;gap:20px;padding:20px;justify-content:center}.side{position:sticky;top:82px;align-self:start}.nav{display:grid;gap:6px}.nav button{text-align:left;background:transparent;border:1px solid transparent;color:var(--muted);padding:12px;border-radius:12px}.nav button.active,.nav button:hover{background:var(--panel2);border-color:var(--line);color:white}.box,.card{background:linear-gradient(145deg,#121a2b,#0e1421);border:1px solid var(--line);border-radius:17px;padding:16px}.box{margin-top:16px}.main{min-width:0}.hero{padding:24px;background:linear-gradient(120deg,#3a2372,#172b59 55%,#0d4b5d);border:1px solid #6450b7;border-radius:20px;margin-bottom:16px}.hero h1{font-size:clamp(28px,4vw,39px);line-height:1.08;margin:10px 0;letter-spacing:-1px}.hero p,.muted{color:var(--muted)}.hero p{color:#e1e8ff;max-width:460px}.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px}.stats strong{display:block;font-size:18px}.stats small{color:#c5d0e8}.composer,.post{margin-bottom:14px}.field{display:grid;gap:6px;margin:11px 0}.field label{font-weight:700;font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.posthead{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));font-weight:900;flex-shrink:0}.postmeta{font-size:12px;color:var(--muted)}.posttext{white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0}.linkpreview{display:flex;gap:12px;align-items:center;background:#0a1120;border:1px solid #303c56;border-radius:12px;padding:12px;color:white;text-decoration:none}.linkpreview div:nth-child(2){min-width:0;flex:1}.linkpreview strong,.linkpreview small{display:block;overflow-wrap:anywhere}.linkpreview small{color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.actions button{background:transparent;border:0;border-radius:8px;padding:7px 9px;color:var(--muted)}.actions button:hover,.actions button.on{background:#252b45;color:var(--cyan)}.right .box{margin-top:0;margin-bottom:14px}.creator,.trend{padding:9px 0;border-bottom:1px solid #222c40;display:flex;align-items:center;gap:9px}.creator:last-child,.trend:last-child{border:0}.creator div:nth-child(2),.trend div{flex:1;min-width:0}.creator strong,.trend strong{display:block;font-size:13px}.creator small,.trend small{color:var(--muted)}.channelgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.channel h3{margin:8px 0 3px}.channel p{color:var(--muted);font-size:13px}.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{flex:1;padding:9px;border-radius:10px;background:#0d1320;border:1px solid var(--line);color:var(--muted)}.tabs button.active{background:#252b45;color:white}.note{padding:12px;background:#132b32;border:1px solid #225562;color:#c7f7ff;border-radius:11px;font-size:13px}.badge{font-size:10px;background:#3c2c67;color:#e9d5ff;padding:3px 7px;border-radius:6px;text-transform:uppercase;font-weight:800}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f5f7ff;color:#101625;padding:12px 17px;border-radius:11px;z-index:30;box-shadow:0 8px 30px #0008;max-width:90%}.mobile{display:none}.small{font-size:12px}.empty{text-align:center;padding:30px;color:var(--muted)}a{color:var(--cyan)}@media(max-width:1080px){.layout{grid-template-columns:180px minmax(0,660px)}.right{display:none}}@media(max-width:720px){.top{padding:10px;gap:9px;flex-wrap:wrap}.logo{font-size:22px}.search{order:3;flex-basis:100%;max-width:none}.layout{display:block;padding:12px 10px 80px}.side{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:space-around;background:#0b101df5;border-top:1px solid var(--line);padding:7px 2px calc(7px + env(safe-area-inset-bottom))}.mobile button{display:grid;justify-items:center;gap:2px;background:transparent;border:0;color:var(--muted);font-size:10px}.mobile button.active{color:var(--cyan)}.mobile button span{font-size:19px}.channelgrid,.grid2{grid-template-columns:1fr}.hero{padding:20px}.right{display:none}}
</style>
</head>
<body>
<header class="top">
<a class="logo" href="#" onclick="go('feed');return false">link<span>.</span>io</a>
<div class="search"><input id="search" placeholder="Search posts and channels..." aria-label="Search"></div>
<button class="btn" onclick="go('channels')">Explore</button><button class="btn primary" onclick="go('promote')">↗ Promote</button>
</header>
<div class="layout">
<aside class="side"><nav class="nav" id="nav">
<button data-page="feed" class="active" onclick="go('feed')">⌂ &nbsp; For you</button>
<button data-page="discover" onclick="go('discover')">◉ &nbsp; Discover</button>
<button data-page="channels" onclick="go('channels')">▤ &nbsp; Channels</button>
<button data-page="following" onclick="go('following')">♡ &nbsp; Following</button>
<button data-page="promote" onclick="go('promote')">↗ &nbsp; Promote a link</button>
<button data-page="profile" onclick="go('profile')">♙ &nbsp; My profile</button>
</nav>
<div class="box"><b id="authTitle">Join Link.io</b><p class="muted small" id="authHint">Sign in to post, follow creators, and build a channel.</p>
<div id="authForm"><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="At least 6 characters" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="signIn()">Sign in</button><button class="btn" style="width:100%;margin-top:7px" onclick="signUp()">Create account</button></div>
<div id="userBox" class="hidden"><p id="signedUser"></p><button class="btn" onclick="signOut()">Sign out</button></div></div>
<div class="box"><b>Creator tip</b><p class="muted small">Clear titles and useful destinations help your links reach the right audience.</p></div>
</aside>
<main class="main" id="main"></main>
<aside class="right"><div class="box"><b>🔥 Channels to explore</b><div id="rightChannels"></div><button class="btn" style="width:100%;margin-top:8px" onclick="go('channels')">All channels →</button></div><div class="box"><b>📣 Promote responsibly</b><p class="muted small">Paid placement should be labeled. Reach estimates are not guaranteed followers.</p><button class="btn primary" onclick="go('promote')">Promotion options</button></div></aside>
</div>
<nav class="mobile" id="mobileNav"><button data-page="feed" class="active" onclick="go('feed')"><span>⌂</span>Home</button><button data-page="discover" onclick="go('discover')"><span>◉</span>Discover</button><button data-page="channels" onclick="go('channels')"><span>▤</span>Channels</button><button data-page="promote" onclick="go('promote')"><span>↗</span>Promote</button><button data-page="profile" onclick="go('profile')"><span>♙</span>Profile</button></nav>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// SET THESE TWO VALUES after creating your Supabase project.
// The anon/publishable key is intended for browser use; NEVER put service_role or Paystack secret keys here.
const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY';
const configured = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');
const supabase = configured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>{try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}};
let session=null,profile=null,posts=[],channels=[],follows=new Set(),page='feed',query='',tab='For you',likes=new Set();
function toast(s){let el=$('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.add('hidden'),3200)}
function needConfig(){if(!supabase){toast('Setup needed: add your Supabase URL and publishable key in index.html.');return true}return false}
function needAuth(){if(!session){toast('Please create an account or sign in first.');return true}return false}
function fmt(n){return Number(n||0).toLocaleString()}
function avatar(name){return `<div class="avatar">${esc((name||'?').slice(0,1).toUpperCase())}</div>`}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function nav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
async function signUp(){if(needConfig())return;let email=$('#email').value.trim(),password=$('#password').value;if(!email||password.length<6){toast('Enter an email and a password of at least 6 characters.');return}let {data,error}=await supabase.auth.signUp({email,password});if(error)return toast(error.message);toast(data.session?'Account created!':'Check your email to confirm your account.');await refreshAuth()}
async function signIn(){if(needConfig())return;let {data,error}=await supabase.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)return toast(error.message);session=data.session;await loadAll();toast('Signed in successfully.')}
async function signOut(){if(!supabase)return;await supabase.auth.signOut();session=null;profile=null;follows.clear();await loadAll();toast('Signed out.')}
async function refreshAuth(){if(!supabase)return;const {data}=await supabase.auth.getSession();session=data.session;await loadAll()}
async function loadAll(){if(!supabase){render();return}if(session){let {data:p}=await supabase.from('profiles').select('*').eq('id',session.user.id).maybeSingle();profile=p;if(!p){let {data:newP}=await supabase.from('profiles').upsert({id:session.user.id,username:'creator_'+session.user.id.slice(0,7),display_name:session.user.email?.split('@')[0]||'Creator'}).select().single();profile=newP}let {data:f}=await supabase.from('follows').select('following_id').eq('follower_id',session.user.id);follows=new Set((f||[]).map(x=>x.following_id));}
let {data:p,error:pe}=await supabase.from('posts').select('*,profiles:author_id(username,display_name),channels(name)').order('created_at',{ascending:false}).limit(80);if(pe)console.error(pe);posts=p||[];
let {data:c,error:ce}=await supabase.from('channels').select('*').order('created_at',{ascending:false}).limit(100);if(ce)console.error(ce);channels=c||[];
let {data:l}=session?await supabase.from('likes').select('post_id').eq('user_id',session.user.id):{data:[]};likes=new Set((l||[]).map(x=>x.post_id));
render()}
function postCard(p){const user=p.profiles?.display_name||p.profiles?.username||'Creator',handle=p.profiles?.username||'creator',url=p.url&&safeUrl(p.url);return `<article class="card post"><div class="posthead">${avatar(user)}<div style="flex:1;min-width:0"><b>${esc(user)}</b><div class="postmeta">@${esc(handle)} · ${new Date(p.created_at).toLocaleString()} · ${esc(p.channels?.name||'General')}</div></div>${p.is_sponsored?'<span class="badge">Sponsored</span>':''}</div><div class="posttext">${esc(p.body||'')}</div>${url?`<a class="linkpreview" href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="window.trackClick('${p.id}')"><div style="font-size:24px">↗</div><div><strong>${esc(p.link_title||new URL(url).hostname)}</strong><small>${esc(url)}</small></div></a>`:''}<div class="actions"><button class="${likes.has(p.id)?'on':''}" onclick="window.toggleLike('${p.id}')">♥ ${fmt(p.like_count)} Like</button><button onclick="window.commentPost('${p.id}')">▢ Comment</button><button onclick="window.sharePost('${p.id}')">↗ Share</button>${session&&p.author_id!==session.user.id?`<button onclick="window.toggleFollow('${p.author_id}')">${follows.has(p.author_id)?'✓ Following':'+ Follow'}</button>`:''}</div></article>`}
function feedHTML(){let list=[...posts];if(page==='following')list=list.filter(p=>follows.has(p.author_id));if(query)list=list.filter(p=>[p.body,p.link_title,p.url,p.profiles?.username,p.profiles?.display_name,p.channels?.name].join(' ').toLowerCase().includes(query));if(tab==='Popular')list.sort((a,b)=>(b.like_count||0)-(a.like_count||0));return `<section class="hero"><div class="badge">Your links. Your people. Your reach.</div><h1>Share more.<br>Reach further.</h1><p>Post links, build a channel, and discover the audience that cares about what you create.</p><button class="btn primary" onclick="document.querySelector('#body').focus()">＋ Create a post</button><div class="stats"><div><strong>${fmt(profile?.follower_count||0)}</strong><small>Followers</small></div><div><strong>${fmt(posts.length)}</strong><small>Recent posts</small></div><div><strong>${fmt(channels.length)}</strong><small>Channels</small></div></div></section><section class="card composer"><div class="posthead">${avatar(profile?.display_name||session?.user?.email||'L')}<div><b>Share something useful</b><div class="muted small">Links, ideas, resources, and updates</div></div></div><div class="field"><label>Post text</label><textarea id="body" rows="3" placeholder="What are you sharing?"></textarea></div><div class="grid2"><div class="field"><label>Link URL (optional)</label><input id="url" type="url" placeholder="https://example.com"></div><div class="field"><label>Link title</label><input id="linkTitle" placeholder="What will people find?"></div></div><div class="grid2"><div class="field"><label>Channel</label><select id="channelId"><option value="">General</option>${channels.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field" style="align-content:end"><button class="btn primary" onclick="window.createPost()">Publish post ↗</button></div></div></section><div class="tabs"><button class="${tab==='For you'?'active':''}" onclick="window.setTab('For you')">For you</button><button class="${tab==='Latest'?'active':''}" onclick="window.setTab('Latest')">Latest</button><button class="${tab==='Popular'?'active':''}" onclick="window.setTab('Popular')">Popular</button></div>${list.map(postCard).join('')||'<div class="card empty">No posts yet. Publish the first one or try another search.</div>'}`}
function channelHTML(){let list=channels.filter(c=>!query||(c.name+' '+c.description).toLowerCase().includes(query));return `<section class="hero"><div class="badge">Find your community</div><h1>Every interest<br>has a channel.</h1><p>Join communities around your interests, or create a space for your audience.</p><button class="btn primary" onclick="window.createChannel()">＋ Create a channel</button></section><div class="channelgrid">${list.map(c=>`<article class="card channel"><div style="font-size:25px">▤</div><h3>${esc(c.name)}</h3><p>${esc(c.description||'A community for shared links and ideas.')}</p><small class="muted">${fmt(c.member_count)} members</small><button class="btn ${c.is_member?'':'primary'}" style="width:100%;margin-top:12px" onclick="window.toggleChannel('${c.id}')">${c.is_member?'Joined':'Join channel'}</button></article>`).join('')||'<div class="card empty">No channels found.</div>'}</div>`}
function promoteHTML(){return `<section class="hero"><div class="badge">Promotion studio</div><h1>Put your link<br>in the spotlight.</h1><p>Choose a campaign budget and pay securely through Paystack. Campaigns remain pending until payment is verified.</p></section><section class="card"><div class="note">Promotions buy sponsored placement and measurable clicks, not guaranteed followers. Your campaign is reviewed before delivery.</div><div class="field"><label>Campaign name</label><input id="campName" placeholder="My new channel"></div><div class="field"><label>Destination URL</label><input id="campUrl" type="url" placeholder="https://example.com"></div><div class="field"><label>Campaign message</label><textarea id="campDesc" rows="3" placeholder="Tell viewers why this link is useful"></textarea></div><div class="grid2"><div class="field"><label>Goal</label><select id="campGoal"><option value="clicks">Link clicks</option><option value="channel">Channel discovery</option><option value="profile">Profile visits</option></select></div><div class="field"><label>Budget</label><select id="campBudget"><option value="50000">₦500</option><option value="100000">₦1,000</option><option value="250000">₦2,500</option><option value="500000">₦5,000</option></select></div></div><button class="btn primary" onclick="window.startCampaign()">Continue to Paystack →</button><p class="muted small">Payment opens only after the backend is configured. Never share your secret key.</p></section><div id="myCampaigns"></div>`}
function profileHTML(){return `<section class="hero"><div class="posthead">${avatar(profile?.display_name||'C')}<div><h1 style="font-size:27px;margin:0">${esc(profile?.display_name||'Creator')}</h1><p style="margin:4px 0">@${esc(profile?.username||'creator')}</p></div></div><p>${esc(profile?.bio||'Add a bio to tell people what you share.')}</p><button class="btn" onclick="window.editProfile()">Edit profile</button><div class="stats"><div><strong>${fmt(profile?.follower_count||0)}</strong><small>Followers</small></div><div><strong>${fmt(profile?.following_count||follows.size)}</strong><small>Following</small></div></div></section><h2>Your posts</h2>${posts.filter(p=>p.author_id===session?.user?.id).map(postCard).join('')||'<div class="card empty">Your posts will appear here.</div>'}`}
function discoverHTML(){return `<section class="hero"><div class="badge">Explore something new</div><h1>Good links travel.</h1><p>Search creators, browse channels, and find ideas worth sharing.</p><button class="btn primary" onclick="go('channels')">Browse channels →</button></section>${posts.slice(0,20).map(postCard).join('')||'<div class="card empty">Posts from the community will appear here.</div>'}`}
function render(){nav();$('#authForm').classList.toggle('hidden',!!session);$('#userBox').classList.toggle('hidden',!session);$('#authTitle').textContent=session?'You are signed in':'Join Link.io';$('#authHint').textContent=session?'Your account is connected.':'Create an account to post and follow creators.';$('#signedUser').textContent=session?.user?.email||'';const main=$('#main');main.innerHTML=page==='channels'?channelHTML():page==='promote'?promoteHTML():page==='profile'?profileHTML():page==='discover'?discoverHTML():feedHTML();$('#rightChannels').innerHTML=channels.slice(0,5).map(c=>`<div class="trend"><div><strong>${esc(c.name)}</strong><small>${fmt(c.member_count)} members</small></div></div>`).join('')||'<p class="muted small">Create the first channel.</p>'}
async function createPost(){if(needAuth())return;let body=$('#body').value.trim(),raw=$('#url').value.trim(),url=raw?safeUrl(raw):null;if(!body&&!raw)return toast('Write something or add a link.');if(raw&&!url)return toast('Enter a valid http(s) link.');let {error}=await supabase.from('posts').insert({author_id:session.user.id,body,url,link_title:$('#linkTitle').value.trim()||null,channel_id:$('#channelId').value||null});if(error)return toast(error.message);await loadAll();toast('Post published!')}
async function toggleLike(id){if(needAuth())return;let was=likes.has(id);let res=was?await supabase.from('likes').delete().eq('post_id',id).eq('user_id',session.user.id):await supabase.from('likes').insert({post_id:id,user_id:session.user.id});if(res.error)return toast(res.error.message);await loadAll()}
async function toggleFollow(id){if(needAuth())return;if(id===session.user.id)return toast('You cannot follow yourself.');let res=follows.has(id)?await supabase.from('follows').delete().eq('follower_id',session.user.id).eq('following_id',id):await supabase.from('follows').insert({follower_id:session.user.id,following_id:id});if(res.error)return toast(res.error.message);await loadAll()}
async function toggleChannel(id){if(needAuth())return;let {data:existing}=await supabase.from('channel_members').select('channel_id').eq('channel_id',id).eq('user_id',session.user.id).maybeSingle();let res=existing?await supabase.from('channel_members').delete().eq('channel_id',id).eq('user_id',session.user.id):await supabase.from('channel_members').insert({channel_id:id,user_id:session.user.id});if(res.error)return toast(res.error.message);await loadAll()}
async function createChannel(){if(needAuth())return;let name=prompt('Channel name (2–40 characters):');if(!name)return;let description=prompt('What is this channel about?')||'';let {error}=await supabase.from('channels').insert({name:name.trim().slice(0,40),description:description.slice(0,240),owner_id:session.user.id});if(error)return toast(error.message);await loadAll();toast('Channel created!')}
async function editProfile(){if(needAuth())return;let display_name=prompt('Display name:',profile?.display_name||'Creator');if(display_name===null)return;let username=prompt('Username (letters, numbers, underscore):',profile?.username||'creator');if(username===null)return;let bio=prompt('Bio:',profile?.bio||'')||'';let {error}=await supabase.from('profiles').update({display_name:display_name.trim().slice(0,50),username:username.trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,30),bio:bio.slice(0,160)}).eq('id',session.user.id);if(error)return toast(error.message);await loadAll();toast('Profile updated.')}
async function commentPost(id){if(needAuth())return;let body=prompt('Write a comment:');if(!body?.trim())return;let {error}=await supabase.from('comments').insert({post_id:id,user_id:session.user.id,body:body.trim().slice(0,1000)});if(error)return toast(error.message);toast('Comment added.')}
async function sharePost(id){let p=posts.find(p=>p.id===id);let url=p?.url||location.href;try{if(navigator.share)await navigator.share({title:p?.link_title||'Link.io',text:p?.body||'',url});else{await navigator.clipboard.writeText(url);toast('Link copied')}}catch{}}
async function trackClick(id){await supabase.rpc('record_post_click',{post_uuid:id})}
async function setTab(t){tab=t;render()}
async function startCampaign(){if(needAuth())return;let title=$('#campName').value.trim(),raw=$('#campUrl').value.trim(),url=safeUrl(raw),description=$('#campDesc').value.trim(),goal=$('#campGoal').value,budget_kobo=Number($('#campBudget').value);if(!title||!url)return toast('Add a campaign name and a valid destination URL.');if(!description)return toast('Add a short campaign message.');const {data,error}=await supabase.from('campaigns').insert({owner_id:session.user.id,title,destination_url:url,description,goal,budget_kobo,status:'pending'}).select().single();if(error)return toast(error.message);const {data:checkout,error:fnError}=await supabase.functions.invoke('paystack-initiate',{body:{campaign_id:data.id}});if(fnError||!checkout?.authorization_url){toast(fnError?.message||checkout?.error||'Could not start checkout. Check Edge Function setup.');return}location.href=checkout.authorization_url}
$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
window.go=go;window.signUp=signUp;window.signIn=signIn;window.signOut=signOut;window.createPost=createPost;window.toggleLike=toggleLike;window.toggleFollow=toggleFollow;window.toggleChannel=toggleChannel;window.createChannel=createChannel;window.editProfile=editProfile;window.commentPost=commentPost;window.sharePost=sharePost;window.trackClick=trackClick;window.setTab=setTab;window.startCampaign=startCampaign;
if(supabase){supabase.auth.onAuthStateChange((_event,s)=>{session=s;setTimeout(()=>loadAll(),0)});refreshAuth()}else render();
</script>
</body></html>
